<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 454" role="img" aria-labelledby="title desc">
  <title id="title">Облачная схема Iter</title>
  <desc id="desc">Браузер обращается к Vercel по HTTPS. Серверный прокси Vercel вызывает Node.js API на Render. Render подключается к PostgreSQL Neon с проверкой TLS.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#82c7b9"/></marker></defs>
  <rect width="640" height="454" rx="12" fill="#17282c"/>
  <g fill="#e4f2ed" stroke="#82c7b9" stroke-width="2">
    <rect x="24" y="20" width="592" height="60" rx="8"/>
    <rect x="24" y="138" width="592" height="60" rx="8"/>
    <rect x="24" y="256" width="592" height="60" rx="8"/>
    <rect x="24" y="374" width="592" height="60" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173e37" text-anchor="middle">
    <text x="320" y="59">Браузер</text>
    <text x="320" y="177">Vercel Hobby</text>
    <text x="320" y="295">Render Free · Node.js API</text>
    <text x="320" y="413">Neon Free · PostgreSQL</text>
  </g>
  <g stroke="#82c7b9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 64 86 V 130"/>
    <path d="M 64 204 V 248"/>
    <path d="M 64 322 V 366"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#d1e8e1">
    <text x="98" y="116">HTTPS: страница и /api</text>
    <text x="98" y="234">Серверный proxy</text>
    <text x="98" y="352">PostgreSQL с проверкой TLS</text>
  </g>
</svg>
